name: Phase 6 Pricing Parity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase6-pricing-parity
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.head_ref == 'agent/truth-closure'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fiscus
          POSTGRES_PASSWORD: fiscus
          POSTGRES_DB: fiscus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiscus -d fiscus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: agent/truth-closure, fetch-depth: 0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Apply exact pricing coverage parity
        run: python scripts/phase6-pricing-parity.py
      - run: git diff --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Team server unit checks
        working-directory: team-server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Team server PostgreSQL integration
        working-directory: team-server
        env: { DATABASE_URL: 'postgresql://fiscus:fiscus@127.0.0.1:5432/fiscus' }
        run: node --disable-warning=ExperimentalWarning --test integration/postgres.test.ts
      - name: Create exact candidate commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/phase6-pricing-parity.py .github/workflows/phase6-pricing-parity.yml
          git add -A
          git config user.name "Fiscus truth-closure bot"
          git config user.email "noreply@github.com"
          git commit -m "Give pricing provenance full GUI parity"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"
      - name: Verify exact clean candidate
        run: npm run release:verify
      - name: Check candidate evidence
        shell: bash
        env: { CANDIDATE_SHA: '${{ steps.candidate.outputs.sha }}' }
        run: |
          node --input-type=module <<'NODE'
          const fs = await import('node:fs/promises');
          const e = JSON.parse(await fs.readFile('.fiscus-release-evidence/release-evidence.json','utf8'));
          if (e.candidate?.sha !== process.env.CANDIDATE_SHA) throw new Error('wrong candidate');
          if (e.source?.typecheck !== 'pass' || e.source?.build !== 'pass' || e.package?.status !== 'pass') throw new Error('missing local evidence');
          NODE
      - name: Push exact candidate
        run: git push origin HEAD:agent/truth-closure
