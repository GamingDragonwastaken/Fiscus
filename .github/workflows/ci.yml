name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-finalize-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: 163b936fb0a9aeeb41519849137e4206c3e4f774

jobs:
  finalize-release-record:
    if: github.head_ref == 'agent/truth-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/truth-closure
          fetch-depth: 0
      - name: Finalize documentation-only release record
        run: bash scripts/finalize-release-gate.sh
