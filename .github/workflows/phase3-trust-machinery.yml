name: Phase 3 Trust Machinery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase3-trust-machinery
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.head_ref == 'agent/truth-closure'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fiscus
          POSTGRES_PASSWORD: fiscus
          POSTGRES_DB: fiscus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscus -d fiscus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/truth-closure
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Apply trust-machinery batch
        run: |
          python scripts/phase3-trust-machinery.py
          python scripts/phase3-control-fixup.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Team server unit checks
        working-directory: team-server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Team server PostgreSQL integration
        working-directory: team-server
        env:
          DATABASE_URL: postgresql://fiscus:fiscus@127.0.0.1:5432/fiscus
        run: node --disable-warning=ExperimentalWarning --test integration/postgres.test.ts
      - name: Create exact candidate commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/phase3-trust-machinery.py scripts/phase3-control-fixup.py .github/workflows/phase3-trust-machinery.yml
          git add -A
          git config user.name "Fiscus truth-closure bot"
          git config user.email "noreply@github.com"
          git commit -m "Make trust boundaries executable"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"
      - name: Verify the exact clean candidate
        run: npm run release:verify
      - name: Inspect release evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const fs = await import('node:fs/promises');
          const evidence = JSON.parse(await fs.readFile('.fiscus-release-evidence/release-evidence.json', 'utf8'));
          if (evidence.candidate?.sha !== process.env.CANDIDATE_SHA) throw new Error('release evidence was not generated from the exact candidate commit');
          if (evidence.source?.typecheck !== 'pass' || evidence.source?.build !== 'pass' || evidence.package?.status !== 'pass') throw new Error('release evidence missing required local passes');
          if (evidence.externalGates?.realProviderReconciliation !== 'external_validation_required') throw new Error('external provider gate was overstated');
          if (evidence.externalGates?.internetTeamDeployment !== 'external_validation_required') throw new Error('external team deployment gate was overstated');
          NODE
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
      - name: Push exact verified candidate
        shell: bash
        run: git push origin HEAD:agent/truth-closure
