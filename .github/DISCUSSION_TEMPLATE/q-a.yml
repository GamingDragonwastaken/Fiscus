labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where did you get stuck?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands you ran and what they printed. Leave out keys, bills and private paths.
      render: shell
  - type: input
    id: setup
    attributes:
      label: Your setup
      placeholder: "OS, Node version, and which AI tools you use (Claude Code, Codex, Cursor, …)"
